name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ 'api/**', 'web/**', '.github/workflows/ci.yml' ]
  pull_request:
    branches: [ "main" ]
    paths: [ 'api/**', 'web/**', '.github/workflows/ci.yml' ]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./api
    env:
      TDLIB_PATH: ${{ github.workspace }}/tdlib/linux_amd64
      APP_ENV: prod
      APP_ROOT: ${{ github.workspace }}/data
      TELEGRAM_API_ID: 1
      TELEGRAM_API_HASH: placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - run: mkdir -p "$APP_ROOT" && chmod +x gradlew && ./gradlew build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./web
    env:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /ws
      NEXT_TELEMETRY_DISABLED: 1
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
